version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: decivault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-decivault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-decivault_dev}
      POSTGRES_DB: ${POSTGRES_DB:-decivault}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-decivault} -d ${POSTGRES_DB:-decivault}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
